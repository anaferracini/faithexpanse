
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="Faith Expanse — Expandindo a fé em Deus, em você e no próximo. Impossívia, o impossível tem uma via.">
<title>Faith Expanse</title>
<link rel="stylesheet" href="css/style.css">

<style>

/* APRESENTAÇÃO PRINCIPAL */

.home-hero {
  min-height:480px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:85px 25px;
  border:0;
}

.home-hero-content {
  max-width:900px;
  margin:auto;
}

.home-hero h1 {
  font-size:clamp(2.8rem,7vw,5rem);
  margin:18px 0;
}

.home-signature {
  color:var(--gold);
  font-family:Georgia,serif;
  font-size:clamp(1.3rem,3vw,2rem);
  font-style:italic;
  line-height:1.5;
  margin:25px auto;
}

.home-purpose {
  max-width:760px;
  margin:30px auto 0;
  font-family:Georgia,serif;
  font-size:clamp(1.15rem,2.5vw,1.55rem);
  line-height:1.7;
  color:var(--cream);
}

/* INTRODUÇÃO */

.intro-section {
  text-align:center;
}

.intro-content {
  max-width:850px;
  margin:auto;
}

.intro-content p {
  line-height:1.9;
  margin-bottom:20px;
}

/* TRÊS PILARES */

.pillars-section {
  text-align:center;
}

.pillars-intro {
  max-width:780px;
  margin:0 auto 35px;
}

.pillars-grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
  margin-top:35px;
}

.pillar-card {
  padding:32px 25px;
  border:1px solid #d9b87966;
  border-radius:12px;
  background:linear-gradient(145deg,#ffffff0d,#ffffff04);
  text-align:left;
  transition:transform .3s,border-color .3s;
}

.pillar-card:hover {
  transform:translateY(-4px);
  border-color:var(--gold);
}

.pillar-number {
  display:block;
  color:var(--rose);
  font-family:Georgia,serif;
  font-size:2rem;
  margin-bottom:15px;
}

.pillar-card h3 {
  color:var(--gold);
  font-family:Georgia,serif;
  font-size:1.45rem;
  margin-bottom:18px;
}

.pillar-card p {
  color:var(--muted);
  line-height:1.85;
  margin-bottom:14px;
}

.pillar-highlight {
  color:var(--cream);
  font-style:italic;
  border-top:1px solid #ffffff25;
  padding-top:17px;
  margin-top:20px;
}

/* IMPOSSÍVIA */

.impossivia-section {
  text-align:center;
}

.impossivia-content {
  max-width:850px;
  margin:auto;
  padding:45px 35px;
  border:1px solid #d9b87977;
  border-radius:12px;
  background:linear-gradient(145deg,#ffffff10,#ffffff04);
}

.impossivia-title {
  color:var(--gold);
  font-family:Georgia,serif;
  font-size:clamp(1.8rem,4vw,2.7rem);
  font-style:italic;
  line-height:1.5;
  margin:20px auto;
}

.impossivia-content p {
  color:var(--muted);
  line-height:1.9;
  margin:18px auto;
}

/* NOSSA ESSÊNCIA */

.essence-content {
  max-width:850px;
  margin:auto;
}

.essence-content p {
  line-height:1.9;
  margin-bottom:20px;
}

.essence-quote {
  margin:35px auto;
  padding:25px;
  border-left:3px solid var(--gold);
  background:#ffffff08;
  color:var(--cream);
  font-family:Georgia,serif;
  font-size:1.2rem;
  font-style:italic;
  line-height:1.8;
}

/* ENCERRAMENTO */

.closing-section {
  text-align:center;
  padding-top:65px;
  padding-bottom:75px;
}

.closing-content {
  max-width:800px;
  margin:auto;
}

.closing-signature {
  color:var(--gold);
  font-family:Georgia,serif;
  font-size:clamp(1.3rem,3vw,2rem);
  font-style:italic;
  line-height:1.6;
  margin:25px auto;
}

/* LOGO */

.site-logo {
  display:block;
  width:150px;
  max-width:38vw;
  height:auto;
  object-fit:contain;
}

/* MENU SUSPENSO DOS PROJETOS */

.project-dropdown {
  position:relative;
}

.project-dropdown summary {
  list-style:none;
  cursor:pointer;
}

.project-dropdown summary::-webkit-details-marker {
  display:none;
}

.project-dropdown summary::after {
  content:"⌄";
  display:inline-block;
  margin-left:7px;
  transition:transform .2s;
}

.project-dropdown[open] summary::after {
  transform:rotate(180deg);
}

.project-dropdown .dropdown-list {
  position:absolute;
  top:calc(100% + 12px);
  right:0;
  z-index:1000;
  min-width:230px;
  padding:10px;
  display:grid;
  gap:3px;
  background:#17213b;
  border:1px solid #d9b87988;
  border-radius:9px;
  box-shadow:0 12px 30px #0008;
}

.project-dropdown .dropdown-list a {
  display:block;
  padding:10px 12px;
  color:var(--cream);
  text-decoration:none;
  border-radius:5px;
}

.project-dropdown .dropdown-list a:hover {
  color:var(--gold);
  background:#ffffff10;
}

/* RESPONSIVIDADE */

@media(max-width:760px) {
  .pillars-grid {
    grid-template-columns:1fr;
  }

  .pillar-card {
    padding:27px 22px;
  }

  .home-hero {
    min-height:400px;
    padding:65px 20px;
  }

  .impossivia-content {
    padding:32px 22px;
  }
}

@media(max-width:520px) {
  .project-dropdown .dropdown-list {
    right:-55px;
    min-width:210px;
  }
}

</style>
</head>

      </a>

      <div class="links">
        <a href="#inicio">Início</a>

        <details class="project-dropdown">
          <summary
